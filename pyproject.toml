[project]
name = "deadband"
version = "0.1.0"
description = "Trade and position ledger"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# `def route(conn = Depends(get_conn))` is how FastAPI declares a dependency,
# and B008 (function-call-in-default-argument) flags every one of them -- 17
# across api/ as of 2026-09-09. Naming those calls immutable is narrower than
# ignoring B008, which would also stop catching what the rule is actually for:
# a genuinely mutable or time-varying default like `def f(x=[])` or
# `def f(t=datetime.now())`. Those still fail.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["ledger", "importers", "db", "venues"]
